<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REFUA - Ficha Médica de Emergencia</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f4f9; margin: 0; padding: 12px; color: #111; }
        .card { background: #fff; border-radius: 8px; border: 2px solid #d32f2f; padding: 16px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { background: #d32f2f; color: #fff; text-align: center; padding: 8px; font-weight: bold; border-radius: 4px; font-size: 1.1em; letter-spacing: 1px; }
        .patient-name { font-size: 1.4em; font-weight: bold; margin: 12px 0 4px 0; text-transform: uppercase; }
        .blood-type { background: #ffebee; color: #c62828; display: inline-block; padding: 6px 12px; font-weight: bold; font-size: 1.2em; border-radius: 4px; border: 1px solid #ef9a9a; margin-bottom: 12px; }
        .section-title { font-size: 0.85em; color: #555; text-transform: uppercase; font-weight: bold; margin-top: 12px; border-bottom: 1px solid #eee; padding-bottom: 2px; }
        .data-text { font-size: 1.05em; font-weight: bold; color: #000; margin: 4px 0 10px 0; }
        .btn-call { display: block; background: #2e7d32; color: white; text-align: center; text-decoration: none; padding: 12px; font-weight: bold; font-size: 1.1em; border-radius: 6px; margin-top: 8px; }
        .footer { text-align: center; font-size: 0.75em; color: #777; margin-top: 16px; }
        .loader { text-align: center; padding: 20px; font-weight: bold; color: #555; }
        .alert-error { background: #fff3cd; color: #856404; padding: 12px; border-radius: 6px; border: 1px solid #ffeeba; text-align: center; }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <div class="loader" id="loader">Cargando información médica...</div>
    <div id="content" style="display: none;">
        <div class="header">🚨 IDENTIFICACIÓN MÉRICA REFUA</div>
        
        <div class="patient-name" id="nombre">---</div>
        <div style="font-size: 0.9em; color: #444; margin-bottom: 8px;" id="cedula">C.I.: ---</div>
        
        <div class="blood-type" id="sangre">🩸 SANGRE: ---</div>

        <div class="section-title">⚠️ ALERGIAS CRÍTICAS</div>
        <div class="data-text" style="color: #c62828;" id="alergias">NINGUNA REGISTRADA</div>

        <div class="section-title">🏥 PATOLOGÍAS DE BASE</div>
        <div class="data-text" id="patologias">NINGUNA</div>

        <div class="section-title">💊 MEDICACIÓN CONTINUA</div>
        <div class="data-text" id="medicacion">NINGUNA</div>

        <div class="section-title">📞 CONTACTOS DE EMERGENCIA (ICE)</div>
        <a href="#" id="btn-call-1" class="btn-call" style="display:none;">📞 LLAMAR CONTACTO 1</a>
        <a href="#" id="btn-call-2" class="btn-call" style="background:#1565c0; display:none;">📞 LLAMAR CONTACTO 2</a>

        <div class="footer">Sistema de Respuesta Médica - ID: <span id="id-display">---</span></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Configuración de Supabase (Sustituye con tus claves)
    const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
    const SUPABASE_KEY = 'TU_KEY_ANON_PUBLICA';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Obtener parámetro de la URL (ej: refua.com.ve/?id=REF-00001)
    const urlParams = new URLSearchParams(window.location.search);
    const idCodigo = urlParams.get('id');

    async function cargarFicha() {
        if (!idCodigo) {
            mostrarError('Dispositivo sin código de identificación válido.');
            return;
        }

        const { data, error } = await _supabase
            .from('pacientes')
            .select('*')
            .eq('id_codigo', idCodigo)
            .single();

        if (error || !data) {
            mostrarError('Dispositivo no activado o inexistente.');
            return;
        }

        document.getElementById('loader').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        document.getElementById('nombre').innerText = data.nombre_completo || 'DESCONOCIDO';
        document.getElementById('cedula').innerText = `C.I.: ${data.cedula || 'N/A'}`;
        document.getElementById('sangre').innerText = `🩸 SANGRE: ${data.grupo_sanguineo || 'N/A'}`;
        document.getElementById('alergias').innerText = data.alergias || 'NINGUNA REGISTRADA';
        document.getElementById('patologias').innerText = data.patologias || 'NINGUNA';
        document.getElementById('medicacion').innerText = data.medicacion || 'NINGUNA';
        document.getElementById('id-display').innerText = data.id_codigo;

        if (data.contacto_1_telefono) {
            const btn1 = document.getElementById('btn-call-1');
            btn1.href = `tel:${data.contacto_1_telefono}`;
            btn1.innerText = `📞 LLAMAR: ${data.contacto_1_nombre || 'Contacto 1'}`;
            btn1.style.display = 'block';
        }

        if (data.contacto_2_telefono) {
            const btn2 = document.getElementById('btn-call-2');
            btn2.href = `tel:${data.contacto_2_telefono}`;
            btn2.innerText = `📞 LLAMAR: ${data.contacto_2_nombre || 'Contacto 2'}`;
            btn2.style.display = 'block';
        }
    }

    function mostrarError(mensaje) {
        document.getElementById('main-card').innerHTML = `<div class="alert-error">⚠️ ${mensaje}</div>`;
    }

    cargarFicha();
</script>

</body>
</html>
